[package]
name = "gpui-markdown-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "WYSIWYG Markdown editor component for GPUI (Zed's UI framework) – lossless round-trip, tables, checklists, images."
repository = "https://github.com/taulit/gpui-markdown-editor"
homepage = "https://taulit.github.io/gpui-markdown-editor/"
readme = "README.md"
keywords = ["gpui", "markdown", "editor", "wysiwyg", "rich-text"]
categories = ["gui", "text-editors"]
exclude = ["docs/design/", ".github/", "tests/corpus/", "site/", "marketing/"]
# Publishing to crates.io is a manual, user-approved step (see docs/release-checklist.md).
publish = false

[features]
default = ["paste-html", "ui"]
# Convert HTML clipboard content into document blocks on paste.
paste-html = ["dep:html5ever"]
# Optional UI parts: FormatBar, SlashMenu, LinkPopover, FindBar.
ui = []
# `Serialize`/`Deserialize` for `DocMeta`, so hosts can persist it.
serde = ["dep:serde"]

[dependencies]
# gpui-component pins the exact gpui-pre snapshot. Both versions move together.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.10.0"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1.13"
smallvec = "1.15"
# Decodes and downscales images off the UI thread (the version gpui uses).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
html5ever = { version = "0.40", optional = true }
# Reads image downloads with a size cap (the version gpui uses).
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "test-support"] }
insta = "1.49"
proptest = "1.12"
criterion = "0.8"
indoc = "2"
serde_json = "1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bench]]
name = "markdown"
harness = false

[[bench]]
name = "editor"
harness = false
